services:
  bootstrap:
    image: allerthsbageri-backend:latest
    command: ['node', 'dist/db/bootstrap.js']
    env_file:
      - .env.prod
    volumes:
      - app-data:/app/data
      - /migrations:/app/migrations:ro
    restart: 'no'

  app:
    image: allerthsbageri-backend:latest
    command: ['node', 'dist/server.js']
    env_file:
      - .env.prod
    volumes:
      - app-data:/app/data
    ports:
      - '4000:4000'
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  app-data:
